<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抖音开放平台助手</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #1d2129;
      --muted: #86909c;
      --border: #e5e6eb;
      --primary: #fe2c55;
      --primary-dark: #d91b44;
      --success: #00b42a;
      --danger: #f53f3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      width: 560px;
      min-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body.embedded {
      width: 100%;
      min-height: 100%;
    }

    .header {
      padding: 10px 12px;
      background: linear-gradient(135deg, var(--primary), #ff6b83);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-main {
      min-width: 0;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }

    .header p {
      margin-top: 2px;
      font-size: 11px;
      opacity: 0.9;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn.hidden {
      display: none;
    }

    .content {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: calc(100% - 60px);
      align-content: start;
    }

    body:not(.embedded) .content {
      min-height: calc(560px - 60px);
    }

    .section {
      background: var(--panel);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(15, 35, 95, 0.08);
      min-width: 0;
    }

    .section h2 {
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .section.compact {
      padding-bottom: 8px;
    }

    .meta-list {
      display: grid;
      gap: 5px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .meta-item .label {
      color: var(--muted);
    }

    .meta-item .value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-dot.on {
      background: var(--success);
      box-shadow: 0 0 6px rgba(0, 180, 42, 0.4);
    }

    .status-dot.off {
      background: #c9cdd4;
    }

    .btn-row,
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      margin-top: 8px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      min-width: 90px;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-danger {
      background: #fff5f5;
      color: var(--danger);
      border-color: #ffd8d8;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .search-form {
      display: grid;
      gap: 6px;
    }

    .input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      background: #fff;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .result-summary {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .result-list {
      display: grid;
      gap: 6px;
      max-height: 170px;
      overflow-y: auto;
    }

    .result-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: #fbfcff;
      cursor: pointer;
    }

    .result-item.active {
      border-color: var(--primary);
      background: #fff3f6;
    }

    .result-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .result-meta {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }

    .detail-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcff;
      padding: 8px;
      max-height: 214px;
      overflow: auto;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .detail-actions .btn {
      flex: 1 1 88px;
      min-width: 88px;
    }

    .empty {
      padding: 14px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: #fcfcfd;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: #1d2129;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background: var(--success);
    }

    .toast.error {
      background: var(--danger);
    }

    #sectionSearch {
      grid-column: 1 / span 2;
    }

    #sectionResults,
    #sectionDetail {
      min-height: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-main">
      <h1>抖音开放平台助手</h1>
      <p>登录持久化、试玩管理抓取与本地检索</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn hidden" id="btnClosePanel" title="关闭面板" aria-label="关闭面板">×</button>
    </div>
  </div>

  <div class="content">
    <section class="section compact" id="sectionLogin">
      <h2>登录状态</h2>
      <div class="meta-list">
        <div class="meta-item">
          <span class="label">状态</span>
          <span class="value" id="loginStatus"><span class="status-dot off"></span>检测中...</span>
        </div>
        <div class="meta-item">
          <span class="label">当前 Cookie 数</span>
          <span class="value" id="cookieCount">-</span>
        </div>
        <div class="meta-item">
          <span class="label">登录快照</span>
          <span class="value" id="savedInfo">尚未保存</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnSave">保存登录</button>
        <button class="btn btn-secondary" id="btnRestore">恢复登录</button>
        <button class="btn btn-danger" id="btnClearCookies">清除 Cookie</button>
      </div>
    </section>

    <section class="section compact" id="sectionCrawl">
      <h2>试玩管理抓取</h2>
      <div class="meta-list">
        <div class="meta-item">
          <span class="label">目标页面</span>
          <span class="value" id="pageInfo">检测中...</span>
        </div>
        <div class="meta-item">
          <span class="label">抓取状态</span>
          <span class="value" id="crawlStatus">等待抓取</span>
        </div>
        <div class="meta-item">
          <span class="label">总页数 / 总条数</span>
          <span class="value" id="crawlSummary">0 / 0</span>
        </div>
        <div class="meta-item">
          <span class="label">最近抓取</span>
          <span class="value" id="capturedAt">-</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnStartCrawl">开始抓取</button>
        <button class="btn btn-secondary" id="btnRefresh">刷新状态</button>
        <button class="btn btn-danger" id="btnClearDataset">清空抓取数据</button>
      </div>
      <div class="hint" id="crawlHint">请切到试玩管理页面后执行抓取。抓取过程中请勿手动翻页。</div>
    </section>

    <section class="section compact" id="sectionSearch">
      <h2>本地搜索</h2>
      <div class="search-form">
        <input class="input" id="searchKeyword" placeholder="搜索 AppID 或试玩游戏名">
        <div class="filter-row">
          <select class="input" id="filterPublishStatus">
            <option value="">全部发布状态</option>
          </select>
          <select class="input" id="filterPlanRelation">
            <option value="">全部广告计划关联状态</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btnSearch">搜索</button>
          <button class="btn btn-secondary" id="btnResetSearch">清空条件</button>
        </div>
      </div>
      <div class="hint">规则：单关键字混合匹配 AppID 与试玩游戏名，并支持按发布状态、是否关联广告计划筛选。</div>
    </section>

    <section class="section compact" id="sectionResults">
      <h2>搜索结果</h2>
      <div class="result-summary" id="resultSummary">暂无搜索结果</div>
      <div class="result-list" id="resultList">
        <div class="empty">先抓取，再输入搜索条件。</div>
      </div>
    </section>

    <section class="section compact" id="sectionDetail">
      <h2>结果详情</h2>
      <div class="detail-actions" id="detailActions">
        <button class="btn btn-secondary" disabled>先选择一个搜索结果</button>
      </div>
      <div class="detail-box" id="detailBox">点击上方结果项后，在这里查看字段详情和原始文本。</div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>

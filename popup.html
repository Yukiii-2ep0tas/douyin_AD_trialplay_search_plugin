<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抖音开放平台助手</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #1d2129;
      --muted: #86909c;
      --border: #e5e6eb;
      --primary: #fe2c55;
      --primary-dark: #d91b44;
      --success: #00b42a;
      --danger: #f53f3f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 420px;
      min-height: 640px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      padding: 16px 18px;
      background: linear-gradient(135deg, var(--primary), #ff6b83);
      color: #fff;
    }

    .header h1 {
      font-size: 17px;
      font-weight: 600;
    }

    .header p {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section {
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(15, 35, 95, 0.08);
    }

    .section h2 {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .meta-list {
      display: grid;
      gap: 8px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .meta-item .label {
      color: var(--muted);
    }

    .meta-item .value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-dot.on {
      background: var(--success);
      box-shadow: 0 0 6px rgba(0, 180, 42, 0.4);
    }

    .status-dot.off {
      background: #c9cdd4;
    }

    .btn-row,
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      margin-top: 10px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      min-width: 110px;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-danger {
      background: #fff5f5;
      color: var(--danger);
      border-color: #ffd8d8;
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .search-form {
      display: grid;
      gap: 8px;
    }

    .input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fff;
    }

    .result-summary {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .result-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .result-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fbfcff;
      cursor: pointer;
    }

    .result-item.active {
      border-color: var(--primary);
      background: #fff3f6;
    }

    .result-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .result-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .detail-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fbfcff;
      padding: 10px;
      max-height: 220px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .detail-actions .btn {
      flex: 1 1 110px;
      min-width: 110px;
    }

    .empty {
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: #fcfcfd;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: #1d2129;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background: var(--success);
    }

    .toast.error {
      background: var(--danger);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>抖音开放平台助手</h1>
    <p>登录持久化、试玩管理抓取与本地检索</p>
  </div>

  <div class="content">
    <section class="section">
      <h2>登录状态</h2>
      <div class="meta-list">
        <div class="meta-item">
          <span class="label">状态</span>
          <span class="value" id="loginStatus"><span class="status-dot off"></span>检测中...</span>
        </div>
        <div class="meta-item">
          <span class="label">当前 Cookie 数</span>
          <span class="value" id="cookieCount">-</span>
        </div>
        <div class="meta-item">
          <span class="label">登录快照</span>
          <span class="value" id="savedInfo">尚未保存</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnSave">保存登录</button>
        <button class="btn btn-secondary" id="btnRestore">恢复登录</button>
        <button class="btn btn-danger" id="btnClearCookies">清除 Cookie</button>
      </div>
    </section>

    <section class="section">
      <h2>试玩管理抓取</h2>
      <div class="meta-list">
        <div class="meta-item">
          <span class="label">目标页面</span>
          <span class="value" id="pageInfo">检测中...</span>
        </div>
        <div class="meta-item">
          <span class="label">抓取状态</span>
          <span class="value" id="crawlStatus">等待抓取</span>
        </div>
        <div class="meta-item">
          <span class="label">总页数 / 总条数</span>
          <span class="value" id="crawlSummary">0 / 0</span>
        </div>
        <div class="meta-item">
          <span class="label">最近抓取</span>
          <span class="value" id="capturedAt">-</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnStartCrawl">开始抓取</button>
        <button class="btn btn-secondary" id="btnRefresh">刷新状态</button>
        <button class="btn btn-danger" id="btnClearDataset">清空抓取数据</button>
      </div>
      <div class="hint" id="crawlHint">请切到试玩管理页面后执行抓取。抓取过程中请勿手动翻页。</div>
    </section>

    <section class="section">
      <h2>本地搜索</h2>
      <div class="search-form">
        <input class="input" id="searchAppId" placeholder="按 AppID 精确搜索">
        <input class="input" id="searchGameName" placeholder="按试玩游戏名包含搜索">
        <div class="btn-row">
          <button class="btn btn-primary" id="btnSearch">搜索</button>
          <button class="btn btn-secondary" id="btnResetSearch">清空条件</button>
        </div>
      </div>
      <div class="hint">规则：AppID 精确匹配；试玩游戏名不区分大小写包含匹配。</div>
    </section>

    <section class="section">
      <h2>搜索结果</h2>
      <div class="result-summary" id="resultSummary">暂无搜索结果</div>
      <div class="result-list" id="resultList">
        <div class="empty">先抓取，再输入搜索条件。</div>
      </div>
    </section>

    <section class="section">
      <h2>结果详情</h2>
      <div class="detail-actions" id="detailActions">
        <button class="btn btn-secondary" disabled>先选择一个搜索结果</button>
      </div>
      <div class="detail-box" id="detailBox">点击上方结果项后，在这里查看字段详情和原始文本。</div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
